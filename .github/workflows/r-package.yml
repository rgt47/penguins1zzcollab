# Compendia CI v1.1 -- package validation (Tiers 1 and 2)
#
# Two-tier package check for a zzcollab compendium. Tier 3 (render)
# is handled by the companion workflow blog-render.yml, which
# path-filters to changes under analysis/report/, renv.lock, and
# Dockerfile. This split keeps the always-on package check fast
# and the expensive render gated on render-relevant changes only.
#
#   validate : Tier 1 -- environment integrity (renv restore + status)
#   check    : Tier 2 -- R CMD check via check-r-package
#
# See zzcollab/docs/ci-strategy-tiered-model.md for rationale.

name: Package Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # =============================================================
  # Tier 1: Environment Integrity
  # =============================================================
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Report renv status
        shell: Rscript {0}
        run: |
          renv::status()

      - name: zzrenvcheck audit (optional)
        shell: Rscript {0}
        run: |
          if (requireNamespace('zzrenvcheck', quietly = TRUE)) {
            zzrenvcheck::check_packages()
          } else {
            cat('zzrenvcheck not installed; skipping audit.\n')
          }

  # =============================================================
  # Tier 2: Code Correctness
  # =============================================================
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
